org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric versions: check https://fabricmc.net/develop for the newest ones.
# These match Minecraft 26.3. For 26.1.2 use: minecraft_version=26.1.2,
# loader_version=0.19.3, fabric_api_version=0.151.0+26.1.2 (and see README).
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.165.0+26.3

# Mod
mod_version=0.1.0
maven_group=dev.unseen
archives_base_name=unseen

# Simple Voice Chat (used by the unseen-voice companion mod).
# API = what we compile against; mod = the real thing the dev client runs next to.
voicechat_api_version=2.6.25
voicechat_mod_version=fabric-2.6.26+26.3
